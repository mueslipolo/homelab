# Scheduled jobs, run by scripts/run-jobs.sh (the only DSM Task Scheduler
# entry; see docs/guides/10-backups-and-jobs.md). One job per line:
#
#   name   time   timeout   script [args...]
#
# A job is due once the local time has passed `time` and it has not succeeded
# yet today. Missed runs (NAS off, reboot) catch up on the next tick; a failed
# run is retried an hour later. `time` = tick: every tick (every 15 minutes),
# for jobs that are cheap when there is nothing to do. `script` is relative to scripts/. Each job's
# environment comes from the local jobs.env passed to run-jobs.sh.
#
# A job whose app isn't deployed here exits 77 ("not set up"): no state, no
# alert, nothing on the dashboard. To drop, move or add jobs on one NAS, copy
# this file to $OPS_HOME/jobs.conf and edit the copy: run-jobs.sh prefers it
# (it no longer follows this one's changes).
#
# The times suit backups that start at 20:40 (off-site) and 03:00 (local):
# anything a backup should contain must finish before it. Other backup times:
# move them in a local copy.

forgejo-dump      20:00   30m   forgejo-dump.sh
mealie-backup     20:05   20m   mealie-backup.sh
paperless-export  20:10   25m   paperless-export.sh

# Renovate runs at 06:00 (.forgejo/workflows/renovate.yaml); push each new
# PR to ntfy (docs/guides/11-notifications.md).
renovate-notify   07:00   5m    renovate-notify.sh

# Unused Docker images and old build cache (Renovate bumps, rebuilds, CI).
docker-prune      04:30   30m   docker-prune.sh

# The dashboard's Storage tab: sizes, history, the media library. The first
# run probes every video once (can take hours; a cut-short run resumes the
# next night), later runs only new files.
storage-scan      05:00   3h    storage-scan.sh

# Locally built images. Dockhand never builds them (their compose has
# `pull_policy: never` and no `build:`); this builds each one whenever its
# stack's code changes in git. Also the CI image (.forgejo/ci), which the
# runner uses as is.
build-images      tick    30m   build-images.sh paperless-tarmed=paperless-tarmed:0.1.0 .forgejo/ci=homelab-ci:1
# Then starts them: a stack whose container does not run the image under its
# tag is redeployed through Dockhand (lib/stacks.sh).
redeploy-images   tick    10m   redeploy-images.sh paperless-tarmed=paperless-tarmed:0.1.0
