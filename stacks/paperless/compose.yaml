# Docker's own log format, rotated, instead of Container Manager's `db` driver,
# which wrote every log line to a SQLite file and kept the RAID busy with
# small forced writes (docs/operations.md, "Container logs").
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${PAPERLESS_DOCKER_ROOT}/db:/var/lib/postgresql/data
    networks:
      - paperless_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  broker:
    logging: *logging
    image: redis:8
    restart: unless-stopped
    user: "${PAPERLESS_UID}:${PAPERLESS_GID}"
    volumes:
      - ${PAPERLESS_DOCKER_ROOT}/redis:/data
    networks:
      - paperless_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  webserver:
    logging: *logging
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - paperless_net
      - proxy
    volumes:
      - ${PAPERLESS_DATA_ROOT}/data:/usr/src/paperless/data
      - ${PAPERLESS_DATA_ROOT}/media:/usr/src/paperless/media
      - ${PAPERLESS_DATA_ROOT}/export:/usr/src/paperless/export
      - ${PAPERLESS_DATA_ROOT}/scripts:/usr/src/paperless/scripts
      - ${PAPERLESS_INBOX_PATH}:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      USERMAP_UID: ${PAPERLESS_UID}
      USERMAP_GID: ${PAPERLESS_GID}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_TIME_ZONE: Europe/Zurich
      PAPERLESS_OCR_LANGUAGE: fra+eng
      # redo, not the default auto: auto judges a merged PDF (a digital cover
      # letter + scanned pages) as already having text and never OCRs the
      # scans, so paperless-tarmed finds no bill. Costly per page, hence the
      # caps below.
      PAPERLESS_OCR_MODE: redo
      # One task at a time, OCR on 2 of the DS920+'s 4 cores.
      PAPERLESS_TASK_WORKERS: 1
      PAPERLESS_THREADS_PER_WORKER: 2
      # Defaults are hourly training and mail every 10 min; each run reads the
      # documents or the mailbox for nothing most of the time.
      PAPERLESS_TRAIN_TASK_CRON: "5 */6 * * *"
      PAPERLESS_EMAIL_TASK_CRON: "*/30 * * * *"
      PAPERLESS_FILENAME_FORMAT: "{{document_type}}/{{correspondent}}_{{title}}_{{created}}"
      PAPERLESS_URL: https://paperless.${INTERNAL_DOMAIN}
      # `webserver` is NOT redundant with the hostname above. paperless-tarmed
      # (its own repo and Portainer Stack — see stacks/paperless-tarmed/README.md)
      # calls this API server-to-server over `proxy` as http://webserver:8000, so
      # the Host header it sends is the bare service name. Django rejects any Host
      # missing from this list with a 400 (DisallowedHost), so deleting this
      # breaks custom-field write-back from a different stack.
      PAPERLESS_ALLOWED_HOSTS: paperless.${INTERNAL_DOMAIN},webserver
      PAPERLESS_CONSUMER_RECURSIVE: 1
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000/
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_CONSUMER_ENABLE_BARCODES: 1
      PAPERLESS_CONSUMER_BARCODE_STRING: paperless:separator
      # Native OIDC login via Authelia. Matching client
      # registered in stacks/authelia/config/configuration.yml
      # (identity_providers.oidc.clients, client_id: paperless). The
      # provider_id in this JSON ("authelia") is what determines the OIDC
      # callback URL path Authelia's client redirect_uris must match exactly
      # — see stacks/authelia/README.md before changing either side alone.
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect":{"SCOPE":["openid","profile","email"],"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"authelia","name":"Authelia","client_id":"paperless","secret":"${PAPERLESS_OIDC_CLIENT_SECRET}","settings":{"server_url":"https://auth.${INTERNAL_DOMAIN}","token_auth_method":"client_secret_basic"}}]}}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 2G

  gotenberg:
    logging: *logging
    image: gotenberg/gotenberg:8.38.1
    restart: unless-stopped
    networks:
      - paperless_net
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

  tika:
    logging: *logging
    image: apache/tika@sha256:06bcdbd09aca073293e5a171ad161418cc93c91d58d9e4e205064eade84889d4
    restart: unless-stopped
    networks:
      - paperless_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  paperless_net:
    driver: bridge
  proxy:
    external: true
