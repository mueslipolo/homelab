---
server:
  address: 'tcp://:9091/'

log:
  level: 'info'
  keep_stdout: true

# Users and groups: AUTH_BACKEND=ldap (default) or file.
#
# ldap: Synology's LDAP Server package here, the single source of truth for
# users and groups, shared with DSM login, SMB and Synology Drive. Its schema,
# checked with ldapsearch on a real directory: posixAccount (users),
# posixGroup + memberUid (groups); attributes uid, displayName, mail,
# memberOf, cn. Another directory (OpenLDAP, lldap) may need other filters.
# LDAP_ADDRESS and LDAP_BIND_DN default to the NAS's own LDAP Server and its
# root bind; the bind password is the secret file ldap_bind_password.
#
# file: users_database.yml in AUTHELIA_DATA_ROOT, no directory needed
# (README, "Without LDAP"). Authelia reloads it when it changes.
authentication_backend:
{{- if eq (env "AUTH_BACKEND" | default "ldap") "file" }}
  file:
    path: '/data/users_database.yml'
    watch: true
{{- else }}
  ldap:
    implementation: 'custom'
    address: '{{ env "LDAP_ADDRESS" | default (print "ldap://" (mustEnv "PROXY_GATEWAY_IP") ":389") }}'
    base_dn: '{{ mustEnv "LDAP_BASE_DN" }}'
    user: '{{ env "LDAP_BIND_DN" | default (print "uid=root,cn=users," (mustEnv "LDAP_BASE_DN")) }}'
    password: {{ secret "/secrets/ldap_bind_password" | msquote }}
    users_filter: '(&({username_attribute}={input})(objectClass=posixAccount))'
    groups_filter: '(&(memberUid={username})(objectclass=posixGroup))'
    attributes:
      distinguished_name: 'distinguishedName'
      username: 'uid'
      display_name: 'displayName'
      mail: 'mail'
      member_of: 'memberOf'
      group_name: 'cn'
{{- end }}

session:
  cookies:
    - domain: '{{ mustEnv "INTERNAL_DOMAIN" }}'
      authelia_url: 'https://auth.{{ mustEnv "INTERNAL_DOMAIN" }}'
      default_redirection_url: 'https://dashboard.{{ mustEnv "INTERNAL_DOMAIN" }}'
      same_site: 'lax'

# SQLite in the data folder: consent, OIDC tokens, login attempts. Login
# sessions are not stored here: they are in Authelia's memory (no
# session.redis). Postgres instead: README, "Postgres instead of SQLite".
storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'

# Every policy here is one_factor, so the password is the only barrier: a
# 5-minute ban let a script retry 36 times an hour. Five tries in ten minutes
# still forgives a family member's typos.
regulation:
  max_retries: 5
  find_time: '10 minutes'
  ban_time: '1 hour'

# Native OIDC clients. Each registered app is its own OIDC client here; none
# of them sit behind Caddy's forward_auth like the full-gate apps below. `secret` (not `fileContent`) is used for both the
# JWKS key and client secrets specifically because it strips trailing
# newlines — matters for the PEM key, and recommended by Authelia's own docs
# for exactly this use case.
#
# OIDC_CLIENTS: the apps that log in here, comma-separated (compose's default:
# paperless,mealie,forgejo,dockhand; immich is opt-in). Each needs its secret file,
# <app>_client_secret_hash; empty turns OIDC off, and with it the need for
# oidc_hmac_secret and oidc_jwks_private_key.pem.
{{- $clients := print "," (env "OIDC_CLIENTS" | replace " " "") "," }}
{{- if ne $clients ",," }}
identity_providers:
  oidc:
    hmac_secret: {{ secret "/secrets/oidc_hmac_secret" | msquote }}
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/oidc_jwks_private_key.pem" | mindent 10 "|" | msquote }}
    # Custom authorization policy — restricts a client to a specific group,
    # unlike the built-in one_factor/two_factor policies which allow any
    # authenticated user. Used by the forgejo and dockhand clients below so
    # family members (real Authelia users, needed for mealie/paperless/etc.)
    # can't also authenticate against them just by having any account at all.
    authorization_policies:
      admins_only:
        default_policy: 'deny'
        rules:
          - policy: 'one_factor'
            subject: 'group:{{ env "ADMIN_GROUP" | default "infra-admins" }}'
    clients:
{{- if contains ",paperless," $clients }}
      - client_id: 'paperless'
        client_name: 'Paperless'
        client_secret: {{ secret "/secrets/paperless_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://paperless.{{ mustEnv "INTERNAL_DOMAIN" }}/accounts/oidc/authelia/login/callback/'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
{{- end }}
{{- if contains ",mealie," $clients }}
      # one_factor, not admins_only — Mealie is family-facing (the whole
      # household uses it), unlike forgejo/dockhand below.
      - client_id: 'mealie'
        client_name: 'Mealie'
        client_secret: {{ secret "/secrets/mealie_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://mealie.{{ mustEnv "INTERNAL_DOMAIN" }}/login'
          - 'https://mealie.{{ mustEnv "INTERNAL_DOMAIN" }}/login?direct=1'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
{{- end }}
{{- if contains ",forgejo," $clients }}
      # admins_only (above): Forgejo hosts this
      # repo's own git history and (once added) CI runner config, not a
      # family-facing app; no reason for non-admin accounts to reach it.
      - client_id: 'forgejo'
        client_name: 'Forgejo'
        client_secret: {{ secret "/secrets/forgejo_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'admins_only'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://forgejo.{{ mustEnv "INTERNAL_DOMAIN" }}/user/oauth2/authelia/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
{{- end }}
{{- if contains ",dockhand," $clients }}
      # Dockhand (stacks/dockhand), which deploys every stack: same admins_only
      # reasoning, and more so, since its free edition makes every user an
      # admin (docs/guides/02-dockhand.md). Dockhand sends a
      # PKCE S256 challenge and its secret in the token request's body
      # (src/lib/server/auth.ts, 1.0.56).
      - client_id: 'dockhand'
        client_name: 'Dockhand'
        client_secret: {{ secret "/secrets/dockhand_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'admins_only'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://dockhand.{{ mustEnv "INTERNAL_DOMAIN" }}/api/auth/oidc/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
{{- end }}
{{- if contains ",immich," $clients }}
      # one_factor: family-facing, like mealie. Matches Authelia's Immich
      # integration guide, except client_secret_post (Immich's default token
      # endpoint auth method, so nothing to change on its side). Each person
      # gets their own Immich account (matched by sub, then by email).
      - client_id: 'immich'
        client_name: 'Immich'
        client_secret: {{ secret "/secrets/immich_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          # Web login, and linking an existing account by hand.
          - 'https://immich.{{ mustEnv "INTERNAL_DOMAIN" }}/auth/login'
          - 'https://immich.{{ mustEnv "INTERNAL_DOMAIN" }}/user-settings'
          # The phone app (a custom scheme, which Authelia accepts).
          - 'app.immich:///oauth-callback'
          # Only used if Immich's "Mobile redirect URI override" is turned on:
          # Immich's own page that forwards to app.immich:///oauth-callback.
          # Listed so that switching needs no Authelia restart.
          - 'https://immich.{{ mustEnv "INTERNAL_DOMAIN" }}/api/oauth/mobile-redirect'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
{{- end }}
{{- end }}

access_control:
  default_policy: 'deny'
  rules:
    - domain: 'auth.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'bypass'
    # Full-gate apps. default_policy: deny only matters for
    # hostnames that actually call Authelia's forward-auth endpoint (see the
    # Caddyfile) — jellyfin deliberately has no `import authelia` line
    # (confirmed bypass, Chromecast), so this policy never applies to it
    # regardless of what's listed here.
    # The dashboard: all of it for the admin group, only the family's page
    # (welcome.html, which Caddy serves them at /) for everyone else. Caddy
    # picks the page; this keeps them out even if the Caddyfile changes
    # (stacks/dashboard/README.md, "Two pages").
    - domain: 'dashboard.{{ mustEnv "INTERNAL_DOMAIN" }}'
      subject: 'group:{{ env "ADMIN_GROUP" | default "infra-admins" }}'
      policy: 'one_factor'
    - domain: 'dashboard.{{ mustEnv "INTERNAL_DOMAIN" }}'
      resources:
        - '^/$'
        - '^/welcome\.html$'
        - '^/(icons|fonts|gopher)/'
      policy: 'one_factor'
    - domain: 'sonarr.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'radarr.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'prowlarr.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'qbittorrent.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'seerr.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'maintainerr.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
