---
server:
  address: 'tcp://:9091/'

log:
  level: 'info'
  keep_stdout: true

# Switched from the `file:` backend to `ldap:` — Synology's own LDAP Server
# package is now the single source of truth for both users and groups,
# shared with DSM login, SMB/NTLMv2, and Synology Drive. `users_database.yml`
# is deliberately left in place on AUTHELIA_DATA_ROOT (not deleted) as an
# easy rollback: swap this block back to `file:` and it works again
# unchanged, nothing here touches that file.
#
# Verified against a real ldapsearch on this NAS's actual directory, not
# assumed from generic examples — Synology's LDAP Server uses posixAccount
# (users) / posixGroup+memberUid (groups) schema, confirmed real attribute
# names (uid, displayName, mail, memberOf, cn), not the groupOfUniqueNames/
# uniqueMember schema an earlier draft of this plan assumed.
authentication_backend:
  ldap:
    implementation: 'custom'
    address: 'ldap://{{ mustEnv "PROXY_GATEWAY_IP" }}:389'
    base_dn: '{{ mustEnv "LDAP_BASE_DN" }}'
    user: 'uid=root,cn=users,{{ mustEnv "LDAP_BASE_DN" }}'
    users_filter: '(&({username_attribute}={input})(objectClass=posixAccount))'
    groups_filter: '(&(memberUid={username})(objectclass=posixGroup))'
    attributes:
      distinguished_name: 'distinguishedName'
      username: 'uid'
      display_name: 'displayName'
      mail: 'mail'
      member_of: 'memberOf'
      group_name: 'cn'

session:
  cookies:
    - domain: '{{ mustEnv "INTERNAL_DOMAIN" }}'
      authelia_url: 'https://auth.{{ mustEnv "INTERNAL_DOMAIN" }}'
      default_redirection_url: 'https://dashboard.{{ mustEnv "INTERNAL_DOMAIN" }}'
      same_site: 'lax'

# Postgres, not the `local` (SQLite) backend — SQLite's single-writer
# limitation produced real "database is locked" failures under concurrent
# write load (routine session/regulation writes from every full-gate app's
# forward-auth traffic, colliding with OIDC consent writes), not just
# theoretical risk. Password supplied via AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE
# in compose.yaml, not here — same pattern as the LDAP bind password below.
storage:
  postgres:
    address: 'tcp://postgres:5432'
    database: 'authelia'
    username: 'authelia'

notifier:
  filesystem:
    filename: '/data/notification.txt'

# Every policy here is one_factor, so the password is the only barrier: a
# 5-minute ban let a script retry 36 times an hour. Five tries in ten minutes
# still forgives a family member's typos.
regulation:
  max_retries: 5
  find_time: '10 minutes'
  ban_time: '1 hour'

# Native OIDC clients — Phase 5 Step 4+. Each registered app is its own OIDC
# client here; none of them sit behind Caddy's forward_auth like the
# full-gate apps above. `secret` (not `fileContent`) is used for both the
# JWKS key and client secrets specifically because it strips trailing
# newlines — matters for the PEM key, and recommended by Authelia's own docs
# for exactly this use case.
identity_providers:
  oidc:
    jwks:
      - key_id: 'main'
        algorithm: 'RS256'
        use: 'sig'
        key: {{ secret "/secrets/oidc_jwks_private_key.pem" | mindent 10 "|" | msquote }}
    # Custom authorization policy — restricts a client to a specific group,
    # unlike the built-in one_factor/two_factor policies which allow any
    # authenticated user. Used by the portainer client below so family
    # members (real Authelia users, needed for mealie/paperless/etc.) can't
    # also authenticate against Portainer just by having any account at all.
    authorization_policies:
      admins_only:
        default_policy: 'deny'
        rules:
          - policy: 'one_factor'
            subject: 'group:infra-admins'
    clients:
      - client_id: 'paperless'
        client_name: 'Paperless'
        client_secret: {{ secret "/secrets/paperless_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://paperless.{{ mustEnv "INTERNAL_DOMAIN" }}/accounts/oidc/authelia/login/callback/'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
      # one_factor, not admins_only — Mealie is family-facing (the whole
      # household uses it), unlike portainer/forgejo below.
      - client_id: 'mealie'
        client_name: 'Mealie'
        client_secret: {{ secret "/secrets/mealie_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'one_factor'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://mealie.{{ mustEnv "INTERNAL_DOMAIN" }}/login'
          - 'https://mealie.{{ mustEnv "INTERNAL_DOMAIN" }}/login?direct=1'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
      - client_id: 'portainer'
        client_name: 'Portainer'
        client_secret: {{ secret "/secrets/portainer_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'admins_only'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        # false deliberately, unlike every other client: Portainer CE's OAuth
        # client sends no code_challenge, so true fails every login (matches
        # Authelia's own Portainer integration guide). Revisit if Portainer adds it.
        require_pkce: false
        redirect_uris:
          - 'https://portainer.{{ mustEnv "INTERNAL_DOMAIN" }}'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
      # Same admins_only reasoning as portainer above — Forgejo hosts this
      # repo's own git history and (once added) CI runner config, not a
      # family-facing app; no reason for non-admin accounts to reach it.
      - client_id: 'forgejo'
        client_name: 'Forgejo'
        client_secret: {{ secret "/secrets/forgejo_client_secret_hash" | msquote }}
        public: false
        authorization_policy: 'admins_only'
        consent_mode: 'pre-configured'
        pre_configured_consent_duration: '1 year'
        require_pkce: true
        pkce_challenge_method: 'S256'
        redirect_uris:
          - 'https://forgejo.{{ mustEnv "INTERNAL_DOMAIN" }}/user/oauth2/authelia/callback'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
          - 'groups'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'

access_control:
  default_policy: 'deny'
  rules:
    - domain: 'auth.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'bypass'
    # Full-gate apps — proven via a PoC on dashboard alone (Step 2a), rolled
    # out here (Step 3) once confirmed. default_policy: deny only matters for
    # hostnames that actually call Authelia's forward-auth endpoint (see the
    # Caddyfile) — jellyfin deliberately has no `import authelia` line
    # (confirmed bypass, Chromecast), so this policy never applies to it
    # regardless of what's listed here.
    - domain: 'dashboard.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'sonarr.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'radarr.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'prowlarr.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'qbittorrent.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'jellyseerr.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
    - domain: 'maintainerr.{{ mustEnv "INTERNAL_DOMAIN" }}'
      policy: 'one_factor'
