# Docker's own log format, rotated, instead of Container Manager's `db` driver,
# which wrote every log line to a SQLite file and kept the RAID busy with
# small forced writes (docs/operations.md, "Container logs").
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  authelia:
    logging: *logging
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    environment:
      TZ: Europe/Zurich
      INTERNAL_DOMAIN: ${INTERNAL_DOMAIN}
      # Reaches the NAS's own LDAP Server package (a host-level DSM service,
      # not a container) — same mechanism as stacks/edge's Portainer/Forgejo
      # reverse_proxy blocks, needed here because Authelia's own LDAP client
      # runs inside this container, not on the host. See stacks/edge/README.md's
      # "Host services … via PROXY_GATEWAY_IP" gotcha before changing this.
      PROXY_GATEWAY_IP: ${PROXY_GATEWAY_IP}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc_hmac_secret
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /secrets/ldap_bind_password
    volumes:
      # The folder, not the file: a single-file bind mount keeps the file it
      # first opened, and a Git redeploy replaces the file, so Authelia went on
      # running the old access rules (README, Gotchas).
      - ./config:/config
      - ${AUTHELIA_SECRETS_ROOT}:/secrets:ro
      - ${AUTHELIA_DATA_ROOT}:/data
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  proxy:
    external: true
