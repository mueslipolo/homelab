# Docker's own log format, rotated, instead of Container Manager's `db` driver,
# which wrote every log line to a SQLite file and kept the RAID busy with
# small forced writes (docs/operations.md, "Container logs").
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    logging: *logging
    build:
      context: .
    # No `image:` key, so compose names the build with a project-derived tag that
    # never changes. Without this, `compose up` treats the service as up to date
    # and reuses whatever image already carries that tag: a redeploy fetches the
    # new Dockerfile/Caddyfile, starts the old binary, and reports success. Same
    # failure as stacks/paperless-tarmed, which is where it was first diagnosed.
    # Portainer can still skip the build even with this (guide 02,
    # Troubleshooting): after a Dockerfile change, check the image's .Created.
    pull_policy: build
    # --watch: Caddy re-reads its Caddyfile every second and reloads it when it
    # changes. A Portainer redeploy does not recreate the container for a
    # Caddyfile change alone, so without it the old config keeps running. A
    # Caddyfile that fails to load stops the watching: the last good config
    # keeps serving and later changes are ignored until a restart.
    # CADDYFILE=Caddyfile.minimal for guide 03's one-app start.
    command: ["caddy", "run", "--config", "/etc/caddy/${CADDYFILE:-Caddyfile}", "--adapter", "caddyfile", "--watch"]
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      INTERNAL_DOMAIN: ${INTERNAL_DOMAIN}
      INFOMANIAK_API_TOKEN: ${INFOMANIAK_API_TOKEN}
      PROXY_GATEWAY_IP: ${PROXY_GATEWAY_IP}
    mac_address: ${CADDY_LAN_MAC}
    volumes:
      # The folder, not the file: a single-file mount can stay pinned to the
      # old file after Portainer re-clones the repo.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      proxy:
        aliases:
          - auth.${INTERNAL_DOMAIN}
      lan:
        ipv4_address: ${CADDY_LAN_IP}
        priority: 1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  proxy:
    external: true
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT_INTERFACE}
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}

volumes:
  caddy_data:
  caddy_config:
