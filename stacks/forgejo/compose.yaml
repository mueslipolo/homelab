# Docker's own log format, rotated, instead of Container Manager's `db` driver,
# which wrote every log line to a SQLite file and kept the RAID busy with
# small forced writes (docs/operations.md, "Container logs").
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  forgejo:
    logging: *logging
    image: codeberg.org/forgejo/forgejo:17.0-rootless
    container_name: forgejo
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=true
      - GITEA_WORK_DIR=/var/lib/gitea
      - GITEA_CUSTOM=/var/lib/gitea/custom
      - GITEA_TEMP=/tmp/gitea
      - TMPDIR=/tmp/gitea
      - GITEA_APP_INI=/var/lib/gitea/custom/conf/app.ini
      - HOME=/var/lib/gitea/git
    volumes:
      - ${FORGEJO_DATA_ROOT}:/var/lib/gitea
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "222:2222"
      - "3000:3000"
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  proxy:
    external: true
