# Docker's own log format, rotated, instead of Container Manager's `db` driver,
# which wrote every log line to a SQLite file and kept the RAID busy with
# small forced writes (docs/operations.md, "Container logs").
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  ntfy:
    logging: *logging
    image: binwiederhier/ntfy:v2.31.1
    command: serve
    restart: unless-stopped
    # The image's own default user is root; the data folder belongs to this one.
    user: "${PUID}:${PGID}"
    environment:
      NTFY_BASE_URL: https://ntfy.${INTERNAL_DOMAIN}
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # Nothing is readable or writable without a user or token.
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_BEHIND_PROXY: "true"
      # iPhone only: Apple allows push through its own service, so ntfy.sh
      # relays a content-free "poll now" ping; the message stays here.
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      TZ: Europe/Zurich
    volumes:
      - ${NTFY_DATA_ROOT}:/var/lib/ntfy
    ports:
      # Loopback only: for DSM's own notifications and the scheduler, which run
      # on the host and cannot reach Caddy's macvlan IP. Not on the LAN.
      - "127.0.0.1:2586:8080"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:8080/v1/health -O - | grep -qi '\"healthy\":true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  proxy:
    external: true
