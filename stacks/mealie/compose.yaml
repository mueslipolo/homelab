services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mealie
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: mealie
      TZ: Europe/Zurich
    volumes:
      - ${MEALIE_PGDATA_PATH}:/var/lib/postgresql/data
    networks:
      - mealie
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.29.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Zurich
      ALLOW_SIGNUP: "false"
      BASE_URL: https://mealie.${INTERNAL_DOMAIN}
      DEFAULT_GROUP: Home
      DEFAULT_HOUSEHOLD: Family
      TOKEN_TIME: "48"
      # Native OIDC — replaces the earlier Caddy forward_auth full-gate:
      # forward_auth plus Mealie's own login meant two logins. OIDC_AUTO_REDIRECT
      # skips Mealie's login screen, going straight to Authelia.
      OIDC_AUTH_ENABLED: "true"
      OIDC_AUTO_REDIRECT: "true"
      OIDC_CONFIGURATION_URL: https://auth.${INTERNAL_DOMAIN}/.well-known/openid-configuration
      OIDC_CLIENT_ID: mealie
      OIDC_CLIENT_SECRET: ${MEALIE_OIDC_CLIENT_SECRET}
      ALLOW_PASSWORD_LOGIN: "false"
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mealie
    volumes:
      - ${MEALIE_DATA_PATH}:/app/data/
    networks:
      - mealie
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  mealie:
    driver: bridge
  proxy:
    external: true
