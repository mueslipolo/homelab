# Docker's own log format, rotated, instead of Container Manager's `db` driver,
# which wrote every log line to a SQLite file and kept the RAID busy with
# small forced writes (docs/operations.md, "Container logs").
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  mealie:
    logging: *logging
    image: ghcr.io/mealie-recipes/mealie:v3.29.0
    restart: unless-stopped
    environment:
      TZ: Europe/Zurich
      ALLOW_SIGNUP: "false"
      BASE_URL: https://mealie.${INTERNAL_DOMAIN}
      DEFAULT_GROUP: Home
      DEFAULT_HOUSEHOLD: Family
      TOKEN_TIME: "48"
      # Native OIDC — replaces the earlier Caddy forward_auth full-gate:
      # forward_auth plus Mealie's own login meant two logins. OIDC_AUTO_REDIRECT
      # skips Mealie's login screen, going straight to Authelia.
      OIDC_AUTH_ENABLED: "true"
      OIDC_AUTO_REDIRECT: "true"
      OIDC_CONFIGURATION_URL: https://auth.${INTERNAL_DOMAIN}/.well-known/openid-configuration
      OIDC_CLIENT_ID: mealie
      OIDC_CLIENT_SECRET: ${MEALIE_OIDC_CLIENT_SECRET}
      ALLOW_PASSWORD_LOGIN: "false"
      # Members of this Authelia group are Mealie admins (checked at every
      # login); everyone else is a regular user.
      OIDC_ADMIN_GROUP: infra-admins
      # No DB_ENGINE: SQLite, /app/data/mealie.db (README, "Postgres instead").
    volumes:
      - ${MEALIE_DATA_PATH}:/app/data/
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  proxy:
    external: true
