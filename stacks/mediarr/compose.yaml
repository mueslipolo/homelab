# Docker's own log format, rotated, instead of Container Manager's `db` driver,
# which wrote every log line to a SQLite file and kept the RAID busy with
# small forced writes (docs/operations.md, "Container logs").
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  sonarr:
    logging: *logging
    image: linuxserver/sonarr:4.0.20.3014-ls329
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-Europe/Zurich}
      - UMASK=022
    volumes:
      - ${MEDIARR_CONFIG_ROOT}/sonarr:/config
      - ${MEDIA_ROOT}:/data
    networks:
      - mediarr_net
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 512M

  radarr:
    logging: *logging
    image: linuxserver/radarr:6.4.4.10685-ls324
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-Europe/Zurich}
      - UMASK=022
    volumes:
      - ${MEDIARR_CONFIG_ROOT}/radarr:/config
      - ${MEDIA_ROOT}:/data
    networks:
      - mediarr_net
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 512M

  prowlarr:
    logging: *logging
    image: linuxserver/prowlarr:2.7.0.5723-ls166
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-Europe/Zurich}
      - UMASK=022
    volumes:
      - ${MEDIARR_CONFIG_ROOT}/prowlarr:/config
    networks:
      - mediarr_net
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 512M

  qbittorrent:
    logging: *logging
    image: linuxserver/qbittorrent:5.3.0_v2.1.2-ls485
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-Europe/Zurich}
      - WEBUI_PORT=8090
    volumes:
      - ${MEDIARR_CONFIG_ROOT}/qbittorrent:/config
      - ${MEDIA_ROOT}/torrents:/data/torrents
    networks:
      - mediarr_net
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 1G

  flaresolverr:
    logging: *logging
    image: flaresolverr/flaresolverr:v3.5.2
    restart: always
    environment:
      - TZ=${TZ:-Europe/Zurich}
    networks:
      - mediarr_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 1G

  jellyfin:
    logging: *logging
    image: linuxserver/jellyfin:12.4ubu2604-ls57
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ:-Europe/Zurich}
      - UMASK=022
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${INTERNAL_DOMAIN}
    volumes:
      - ${MEDIARR_CONFIG_ROOT}/jellyfin:/config
      - ${MEDIA_ROOT}/media:/data/media
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    networks:
      - mediarr_net
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 2G

  # Seerr replaced Jellyseerr (https://docs.seerr.dev/migration-guide). Seerr
  # migrates Jellyseerr's config on its first
  # start, so it keeps the old config folder. The `jellyseerr` alias keeps
  # integrations configured with http://jellyseerr:5055 (Maintainerr) working.
  seerr:
    logging: *logging
    image: ghcr.io/seerr-team/seerr:v3.5.1
    restart: always
    # The image no longer ships an init process.
    init: true
    # Seerr runs as `node` (1000) by default and supports --user; PUID:PGID
    # already owns the config folder, so no chown is needed.
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ:-Europe/Zurich}
    volumes:
      - ${MEDIARR_CONFIG_ROOT}/jellyseerr:/app/config
    networks:
      mediarr_net:
        aliases:
          - jellyseerr
      proxy:
        aliases:
          - jellyseerr
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges:true
    # Runs as a non-root user: needs no capabilities.
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

  maintainerr:
    logging: *logging
    image: ghcr.io/maintainerr/maintainerr:3.31.0
    restart: always
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ:-Europe/Zurich}
    volumes:
      - ${MEDIARR_CONFIG_ROOT}/maintainerr:/opt/data
    networks:
      - mediarr_net
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  mediarr_net:
    driver: bridge
  proxy:
    external: true
