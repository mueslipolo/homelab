[package]
name = "immich-verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Checks that every photo and video of a folder or archive is already in Immich, by SHA-1, and copies out the missing ones"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
hex = "0.4.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tar = "0.4.46"
ureq = { version = "3.5.1", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = "thin"
